name: Atari
description: >-
  Atari is one of the founding brands of the interactive entertainment industry,
  originally established in 1972, and today operates as a global video game and
  consumer-hardware company. It publishes classic and modern titles, manufactures
  the Atari VCS console and retro hardware (Atari 2600+, Atari 400 Mini), licenses
  its catalog and brand, and sells games, collectibles, and merchandise through its
  official online store at atari.com. Atari does not publish a general-purpose public
  REST API; its developer surface is limited to Atari VCS content-submission guidance
  (developers email vcs@atari.com and use the VCS submission portal) and legacy HTML5
  Atari Arcade SDK libraries on GitHub. This profile was surfaced as a Mayfield
  portfolio company — a nod to Mayfield's foundational 1970s venture investment in
  Atari — and added to the API Evangelist network for enrichment.
